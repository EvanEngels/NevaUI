name: Release

# Publishing is a deliberate act, not a consequence of merging. A tag is what starts it,
# and a tag is something a person types.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  # The tests run in their own job, with no credentials of any kind. Nothing that can
  # publish is present while three hundred packages of tooling are executing.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to a commit rather than a tag. A tag can be moved by whoever
      # controls the repository it points at; a commit cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # The only credential in this job, and it lasts for one request: npm exchanges this
      # token for permission to publish, so there is no long-lived secret to steal.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # No install scripts, in the job that holds the ability to publish. Every recent
      # npm compromise ran its payload from a lifecycle script; nothing in this tree needs
      # one, so nothing is allowed to run one here.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10.
      - run: npm install --global npm@^11

      - name: Check the tag matches the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      # --provenance attaches a signed statement tying this tarball to this commit and
      # this workflow, so anyone can check that what is on npm came from what is on GitHub.
      - run: npm publish --provenance --access public
